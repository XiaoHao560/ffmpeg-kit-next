name: Sync Upstream and Rebase Build Branch

on:
  # push:
    # branches: [build-android]
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Save current tags
        run: git tag -l | sort -u > /tmp/tags_before.txt

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/arthenica/ffmpeg-kit-next.git
          git fetch upstream --tags --force --prune

      - name: Save new tags
        run: git tag -l | sort -u > /tmp/tags_after.txt

      - name: Sync main
        run: |
          git checkout -B main origin/main
          git merge upstream/main --ff-only || git merge upstream/main --no-edit

      - name: Push main
        run: |
          git push origin main

      - name: Rebase build-android onto main
        run: |
          git fetch origin build-android
          git checkout -B build-android origin/build-android
          if git rebase origin/main -X theirs; then
            echo "✅ Rebase 成功"
          else
            echo "❌ Rebase 失败，自动回退"
            git rebase --abort
            exit 1
          fi

      - name: Push build-android and tags
        run: |
          git push origin build-android --force-with-lease
          git push origin --tags --force-with-lease

      - name: Trigger build if new tags detected
        run: |
          NEW_TAGS=$(comm -13 /tmp/tags_before.txt /tmp/tags_after.txt | grep '^v' || true)
          if [ -z "$NEW_TAGS" ]; then
            echo "没有发现新的版本标签，跳过构建"
            exit 0
          fi
          echo "✅ 发现新标签: $NEW_TAGS"
          LATEST_TAG=$(echo "$NEW_TAGS" | sort -V | tail -n1)
          echo "📌 最新标签: $LATEST_TAG"

          # 触发工作流，ref 指定为 build-android（让 CI 文件可以被找到）
          # 同时传入 tag_name，让 build job 检出该标签的代码
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: Bearer ${{ secrets.PAT }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-android-aar.yml/dispatches \
            -d '{"ref":"build-android","inputs":{"tag_name":"'"$LATEST_TAG"'"}}'